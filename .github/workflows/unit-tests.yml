name: unit-tests

on:
  pull_request: {}
  push:
    branches: [ main, master, release/** ]

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: install dependencies
        run: pip install -r requirements.txt
      - name: test_control_secret
        run: python3 -m unittest tests.test_control_secret -v
      - name: test_identity_fallbacks
        run: python3 -m unittest tests.test_identity_fallbacks -v
      - name: test_google_api_path
        run: python3 -m unittest tests.test_google_api_path -v
      - name: test_interrupt_latency
        run: python3 -m unittest tests.test_interrupt_latency -v
      - name: test_transcript_latency
        run: python3 -m unittest tests.test_transcript_latency -v

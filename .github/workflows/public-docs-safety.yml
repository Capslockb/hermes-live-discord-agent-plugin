name: public-docs-safety

on:
  pull_request: {}
  push:
    branches: [ main, master, release/** ]
    paths:
      - 'README*'
      - 'README/**'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'AGENTS.md'
      - 'SUPPORT.md'
      - 'GOVERNANCE.md'
      - 'docs/**'
      - 'doc/**'
      - 'docs-site/**'
      - 'website/**'
      - 'site/**'
      - 'public/**'
      - '.github/CODEOWNERS'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/pull_request_template/**'
      - '.github/ISSUE_TEMPLATE.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/issue_template.md'
      - '.github/issue_template/**'
      - '.github/workflows/public-docs-safety.yml'
      - 'scripts/public_docs_safety.py'
      - 'tests/test_public_docs_safety.py'
      - 'tests/fixtures/public-docs/**'

jobs:
  public-docs-safety:
    name: public-docs-safety
    runs-on: ubuntu-latest
    env:
      PUBLIC_DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      PUBLIC_DOCS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Scan changed public documents
        run: python3 scripts/public_docs_safety.py
      - name: Run clean-room adversarial tests
        run: python3 tests/test_public_docs_safety.py
